services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d checkin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      PORT: 3000
      CADASTRO_URL: http://mock-service:4000
      DATABASE_URL: postgresql://desafio:desafio@db:5432/checkin?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mock-service:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
